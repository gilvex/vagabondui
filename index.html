<!doctype html>
<html lang="en" data-theme="dark" data-brand="vagabond">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="35 source-owned React components with Radix primitives, Tailwind CSS, and readable Effect-inspired themes."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Vagabond UI — React components</title>
    <script>
      {
        const query = new URLSearchParams(location.search)
        let theme = query.get('theme')
        let brand = query.get('brand')
        try {
          theme ||= localStorage.getItem('vagabond-theme')
          brand ||= localStorage.getItem('vagabond-brand')
        } catch {}
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.brand = ['vagabond', 'gilvex', 'gilgil'].includes(brand)
          ? brand
          : 'vagabond'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
