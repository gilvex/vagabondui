name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run test:unit
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Verify the installable package
        run: pnpm run test:package
      - name: Upload tested npm package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-package
          path: artifacts/
          retention-days: 7
      - name: Build GitHub Pages showcase
        run: pnpm run build:pages
      - name: Test the production subpath build
        run: pnpm run test:pages
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy showcase
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
