name: Publish UI package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in packages/ui/package.json
        required: true
        type: string

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the requested version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-info.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: published-ui-package
          path: artifacts/
      - name: Publish the tested tarball with npm trusted publishing
        env:
          PACKAGE_TARBALL: ${{ steps.release.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --registry=https://registry.npmjs.org/ --access public --provenance
